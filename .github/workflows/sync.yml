# 매시간 노인 구인공고를 수집해 docs/jobs.json 을 갱신하고, 새 공고가 있으면 FCM 푸시를 보낸다.
# 내용이 바뀐 경우에만 커밋 → GitHub Pages 가 자동으로 다시 배포한다.
name: sync

on:
  schedule:
    # 한국시간 07~22시 매시 23분 (UTC 22~13시).
    # 정각 근처는 GitHub 예약 실행이 몰려 지연·누락되기 쉬워서 피함
    - cron: "23 22,23,0-13 * * *"
  workflow_dispatch: {}   # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: 공고 수집
        run: node scripts/sync.js
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- docs; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          git commit -m "data: 공고 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git push
